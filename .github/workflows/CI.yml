name: MKU Data Science CI

on:
  push:
  pull_request:

jobs:
  auto-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Get repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt



        
