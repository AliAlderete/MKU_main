name: MKU Data Science CI

on:
  push:
  pull_request:

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated run
        run: python -m pytest starter/baseline_model.py -v

        
