name: Model Training Artifact

on:
  workflow_run:
    workflows:
      - Model Training Experiments
    types:
      - completed

jobs:
  train-and-upload-model:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Select parameters and train model
        run: python -m model_training.train_experiments

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-regression-model
          path: artifacts/best_model.joblib
          if-no-files-found: error
