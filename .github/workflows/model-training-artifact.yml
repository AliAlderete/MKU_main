name: Model Training Artifact

on:
  push:
    paths:
      - "model_training/**"
      - "starter/baseline_model.py"
      - "requirements.txt"
      - ".github/workflows/model-training-artifact.yml"

jobs:
  train-and-upload-model:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Select parameters and train model
        run: python -m model_training.train_experiments

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-regression-model
          path: artifacts/best_model.joblib
          if-no-files-found: error
